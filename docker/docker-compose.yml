services:
  personal-context-mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - TRANSPORT=http
      - DATABASE__PATH=/data/context.db
      - EMBEDDING__PROVIDER=Hash
      - EMBEDDING__MODEL=sha256-hash-v1
      - EMBEDDING__DIMENSION=128
      - SQLITEVEC__ENABLED=true
      - SQLITEVEC__REQUIRED=true
      - AUTH__MODE=BearerToken
      - AUTH__TOKENS__0=${PERSONAL_CONTEXT_MCP_TOKEN:?Set PERSONAL_CONTEXT_MCP_TOKEN}
    volumes:
      - ./data:/data
